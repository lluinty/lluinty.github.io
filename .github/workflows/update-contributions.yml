name: Refresh GitHub contributions

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:17 UTC.
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_contributions.py"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

concurrency:
  group: refresh-github-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh contribution data
        run: python scripts/update_contributions.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/contributions.json; then
            echo "Contribution data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json
          git commit -m "chore: refresh GitHub contributions"
          git push
