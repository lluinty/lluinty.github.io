name: Refresh GitHub contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "scripts/update_contributions.py"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download contribution history
        run: python scripts/update_contributions.py

      - name: Commit updated data when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json
          if git diff --cached --quiet; then
            echo "Contribution data is already up to date."
          else
            git commit -m "chore: refresh GitHub contributions"
            git push
          fi
